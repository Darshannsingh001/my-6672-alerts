name: Keyword Monitor Watchdog
on:
  schedule:
    - cron: "30 4 * * *"   # ~10:00 IST — safely between your two run times, timing doesn't need to be exact
  workflow_dispatch: {}
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Check heartbeat freshness
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ ! -f last_run.txt ]; then
            echo "No last_run.txt found — monitor may have never run."
            curl -d "Keyword Monitor watchdog: no heartbeat file found. Check the external trigger." \
              -H "Title: Keyword Monitor ALERT" \
              -H "Priority: high" \
              "https://ntfy.sh/$NTFY_TOPIC"
            exit 0
          fi
          LAST=$(date -d "$(cat last_run.txt)" +%s)
          NOW=$(date -u +%s)
          DIFF=$(( (NOW - LAST) / 3600 ))
          echo "Hours since last successful run: $DIFF"
          if [ "$DIFF" -gt 21 ]; then
            curl -d "Keyword Monitor watchdog: no successful run in $DIFF hours. Check cron-job.org and GitHub Actions." \
              -H "Title: Keyword Monitor ALERT" \
              -H "Priority: high" \
              "https://ntfy.sh/$NTFY_TOPIC"
          fi
